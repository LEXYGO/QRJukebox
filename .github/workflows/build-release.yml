name: Build and Release QR Jukebox

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android-fatapk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Recover keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/qrjukebox-release-key.jks
      - run: flutter build apk --release --no-tree-shake-icons
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "QR_Jukebox_${GITHUB_REF#refs/tags/}_universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-universal
          path: QR_Jukebox_*_universal.apk

  build-android-abi-split:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get --enforce-lockfile
      - name: Recover keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 --decode > android/app/qrjukebox-release-key.jks
      - run: flutter build apk --release --no-tree-shake-icons --split-per-abi
      - name: Rename APKs
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "QR_Jukebox_${VERSION}_armv7.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "QR_Jukebox_${VERSION}_arm64v8a.apk"
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk "QR_Jukebox_${VERSION}_x86_64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-armv7
          path: QR_Jukebox_*_armv7.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64v8a
          path: QR_Jukebox_*_arm64v8a.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-x86_64
          path: QR_Jukebox_*_x86_64.apk

  publish-release:
    needs: [build-android-fatapk, build-android-abi-split]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-universal
          path: ./release-files
      - uses: actions/download-artifact@v4
        with:
          name: apk-armv7
          path: ./release-files
      - uses: actions/download-artifact@v4
        with:
          name: apk-arm64v8a
          path: ./release-files
      - uses: actions/download-artifact@v4
        with:
          name: apk-x86_64
          path: ./release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/QR_Jukebox_*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}